name: bluebuild
on:
  schedule:
    - cron:
        "0 6 * * 1" # weekly (Mon 06:00 UTC) — cheaper pace; still auto-pulls latest base updates
  push:
    branches:
      - main # only main publishes; feature branches are validated via PR
    paths:
      - "recipes/recipe.yml"
      - "files/system/**"
      - "files/scripts/**"
      - "files/dnf/**"
      - "!files/scripts/gui-*" # GUI-only scripts build in gui.yml
      - "!**/*.md"
      - ".github/workflows/build.yml"
  # Pull requests always trigger this workflow (no paths filter) so the
  # required `bluebuild` status check is reported on every PR: with a
  # workflow-level paths filter, a GUI-only PR left `bluebuild` "Expected" and
  # unusable to merge even though `bluebuild-gui` succeeded. The expensive
  # build is still skipped for such PRs -- the build step below is conditional,
  # the job itself stays green.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: read # dorny/paths-filter fetches the PR file list via the API
    steps:
      # PR change detection: mirror of the push paths filter above. On
      # push/schedule/dispatch the workflow is already path-filtered, so the
      # build always runs and this step is skipped.
      - name: Detect host-image changes (PR only)
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - "recipes/recipe.yml"
              - "files/system/**"
              - "files/scripts/**"
              - "files/dnf/**"
              - "!files/scripts/gui-*"
              - "!**/*.md"
              - ".github/workflows/build.yml"
      # The build is fully handled by the reusable github action.
      # On pull_request it builds a PR-scoped image (does not touch :latest).
      # On push to main / schedule it publishes + signs :latest.
      # Job id is 'bluebuild' (no matrix) => required status check name = "bluebuild".
      - name: Build Custom Image
        if: github.event_name != 'pull_request' || steps.changes.outputs.build == 'true'
        uses: blue-build/github-action@v1.11
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          # Layer cache to ghcr: unchanged modules (dnf package layer etc.) are
          # pulled from the registry on the next build instead of rebuilding.
          use_cache: true

      # Tag the freshly published :latest with today's date for easy rollback.
      - name: Tag image with date
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          DATE=$(date +%Y.%m.%d)
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "Tagging $IMAGE:latest as $IMAGE:$DATE"
          skopeo copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://$IMAGE:latest" \
            "docker://$IMAGE:$DATE"
