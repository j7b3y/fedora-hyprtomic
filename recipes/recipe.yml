---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-hyprtomic
description: Personal Fedora Atomic Hyprland image (wayblue base) with the end-4/dots-hyprland (illogical-impulse) quickshell UI and Base Dotfiles tools

base-image: ghcr.io/wayblueorg/hyprland
image-version: latest # wayblue's only supported tag; tracks current Fedora stable

modules:
  # NOTE: module order matters for layer caching. Slow-but-stable layers (dnf)
  # go first; frequently-edited layers (files/scripts) go last so dotfile
  # tweaks don't invalidate the package layer.

  # 1. Rebrand os-release (wayblue sets NAME="wayblue", which leaks into GRUB entries)
  - type: os-release
    properties:
      NAME: "HyprTomic"
      PRETTY_NAME: "HyprTomic (powered by Fedora Atomic)"
      VARIANT: "HyprTomic"
      VARIANT_ID: "hyprtomic"
      HOME_URL: "https://github.com/j7b3y/fedora-hyprtomic"
      DOCUMENTATION_URL: "https://github.com/j7b3y/fedora-hyprtomic"
      SUPPORT_URL: "https://github.com/j7b3y/fedora-hyprtomic/issues"
      BUG_REPORT_URL: "https://github.com/j7b3y/fedora-hyprtomic/issues"
      DEFAULT_HOSTNAME: "hyprtomic"

  # 2. COPRs for the illogical-impulse GUI deps + system-layer packages.
  #    Repo files live in files/dnf/ (download.copr CDN pattern, mirroring the
  #    install-ghostty.sh / install-hazkey.sh workaround for the Anubis-blocked
  #    COPR API host) and are removed after the module (cleanup: true) so the
  #    COPR bits stay frozen at build time -- the equivalent of upstream's
  #    `dnf versionlock quickshell-git`.
  #    Note: hyprland itself stays on the wayblue base image, so sdegler/hyprland
  #    is intentionally NOT added.
  - type: dnf
    repos:
      cleanup: true
      files:
        - ririko66z-dots-hyprland.repo # quickshell-git, matugen, microtex, breeze-plus, ii font set
        - deltacopy-darkly.repo        # Qt style (kdeglobals widgetStyle=Darkly)
        - alternateved-eza.repo
        - atim-starship.repo
    install:
      # Not every package above exists on every Fedora branch / COPR build;
      # skip-unavailable keeps the image buildable while staying upstream-faithful.
      skip-unavailable: true
      packages:
        # Session: hyprland/hyprlock/hypridle/portals/sddm come from wayblue base
        # (>= Hyprland 0.55 required for the Lua config)

        # GUI shell (illogical-impulse): quickshell + matugen are installed by
        # install-ii-quickshell.sh from end-4's pinned Fedora 44 RPMs, which are
        # built against the base Qt 6.11 private API. Fedora official's
        # quickshell is far older than the pinned dots (shell fails to load,
        # no bar), and the COPR's quickshell-git is built against Qt 6.10 and
        # cannot be installed here.
        - microtex # LaTeX widget (installed as /opt/MicroTeX)
        - darkly
        # ii runtime: widgets / launchers / OSD
        - fuzzel
        - cava
        - wlogout
        - qalculate
        - songrec
        - translate-shell
        - hyprpicker
        - wf-recorder
        - swappy
        - tesseract
        - tesseract-langpack-eng
        - tesseract-langpack-jpn
        - ImageMagick # exact capitalization; "imagemagick" is a no-match
        # mpvpaper / hyprshot: not packaged in Fedora official or the enabled
        # COPRs. switchwall.sh degrades gracefully without mpvpaper (only
        # video wallpapers affected; static wallpapers go through matugen).
        - wtype
        - ydotool
        # ii runtime: system info / power / display
        - upower
        - geoclue2
        - ddcutil
        # ii runtime: shell scripting deps
        - bc
        - jq
        - ripgrep
        - wget
        - yq
        - rsync # required by ujust sync-skel-config
        - unzip
        - dconf # bakes the gsettings baseline (finalize.sh runs `dconf update`)
        - uv # creates ~/.local/state/quickshell/.venv (first login service)
        - python3-gobject
        - python3-cairo
        # Terminals / prompt (ghostty is the only terminal; kitty intentionally
        # not installed, ii fallbacks are overridden to ghostty in custom/variables.lua)
        - fish
        - eza
        - starship
        - btop # task manager target for the ii shortcuts
        # Cursor / GTK / Qt theming (ii pipeline: matugen + adw-gtk3 + Kvantum + Darkly)
        - bibata-cursor-theme
        - adw-gtk3-theme
        - breeze-icon-theme
        - kf6-breeze-icons
        - breeze-plus-icon-theme
        - kvantum
        - kdialog
        - kf6-kirigami
        - kf6-syntax-highlighting
        - qt6-qtimageformats
        - qt6-qtpositioning
        - qt6-qtquicktimeline
        - qt6-qtsensors
        - qt6-qttools
        - qt6-qttranslations
        # Portals (ii uses the KDE portal UI for theming-aware dialogs)
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-kde
        # Fonts (ii appearance: Google Sans Flex / Readex Pro / Rubik / Space
        # Grotesk + JetBrains Mono NF for monospace/nerd glyphs)
        - florian-karsten-space-grotesk-fonts
        - jetbrains-mono-nerd-fonts
        - google-material-symbols-vf-rounded-fonts
        - material-icons-fonts
        - readex-pro-fonts-all
        - google-rubik-vf-fonts
        - google-sans-flex-vf-fonts
        - twitter-twemoji-fonts
        - google-noto-color-emoji-fonts
        - cascadia-mono-nf-fonts
        # Fonts fallback (system)
        - google-noto-sans-fonts
        - google-noto-sans-cjk-fonts
        - fontawesome-fonts
        # Audio
        - pipewire
        - pipewire-pulseaudio
        - wireplumber
        - pavucontrol
        # Network
        - NetworkManager
        # Bluetooth (managed via the quickshell BluetoothSection)
        - bluez
        # Auth base (polkit handled by quickshell's built-in agent)
        - gnome-keyring
        # Qt wayland backends
        - qt5-qtwayland
        - papirus-icon-theme
        # Screenshot / clipboard
        - grim
        - slurp
        - wl-clipboard
        - cliphist
        # Utilities
        - brightnessctl
        - playerctl
        - libnotify
        - dex-autostart
        - fastfetch
        # File manager (nemo is the Base Dotfiles fileManager override)
        - nemo
        - nemo-extensions
        - file-roller
        - ffmpegthumbnailer
        - tumbler
        # IME (native fcitx5; hazkey engine installed via copr; profile enables it)
        - fcitx5
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-configtool
        # Common dev tools (used across all dev envs)
        - git
        - git-credential-oauth
        - python3-pip
        - android-tools
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting

  # 3. quickshell: built against the base image's Qt (see the script). Kept as
  #    its own script module so it is a separate layer: editing other scripts or
  #    the dotfiles below does not invalidate this expensive build, and the
  #    registry layer cache (use_cache) can reuse it.
  - type: script
    scripts:
      - install-ii-quickshell.sh

  # 4. Bake /etc/skel (illogical-impulse dots + Base Dotfiles), SDDM conf,
  #    systemd units, dconf db, udev rules, ujust recipe
  - type: files
    files:
      - source: system
        destination: /

  # 5. Build-time scripts (live in files/scripts/; reference by bare filename)
  - type: script
    scripts:
      - install-hyprbind.sh
      - install-ghostty.sh
      - install-sddm-theme.sh
      - install-clipryx.sh
      - install-hypr-emoji-picker.sh
      - install-snipland.sh
      - install-hazkey.sh
      - finalize.sh

  # 6. Enable services (firstboot: hostname/zsh; session: ydotool daemon as the
  #    user, mirroring upstream's symlink of the Fedora system unit into user scope)
  - type: systemd
    system:
      enabled:
        - hyprtomic-hostname.service
        - hyprtomic-zsh-default.service
        - hyprtomic-groups.service
    user:
      enabled:
        - hyprtomic-ii-venv.service
        - ydotool.service

  # 7. Default Flatpaks (system scope = auto-provisioned "standard" apps)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.bitwarden.desktop

  - type: signing # proper policy & signing for signed images
