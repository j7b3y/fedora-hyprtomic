# libvirt state directories for the latest-vypr image.
#
# The BlueBuild build wipes /var (ostree assumption), so the directories the
# libvirt RPMs create at install time - and the SELinux labels restorecon
# applied to them - are gone from the image. On first boot the daemons then
# create /var/lib/libvirt themselves without a policy type transition, it ends
# up as var_lib_t instead of virt_var_lib_t, and virtnetworkd (enforcing) is
# denied: /var/lib/libvirt/dnsmasq cannot be created, the default network
# never starts and a VM on it has no network. The directories are recreated
# with the packaged modes and relabelled here; systemd-tmpfiles runs before
# the libvirt sockets are activated.
d /var/cache/libvirt 0711 root root -
d /var/cache/libvirt/qemu 0750 root root -
d /var/lib/libvirt 0755 root root -
d /var/lib/libvirt/boot 0711 root root -
d /var/lib/libvirt/dnsmasq 0755 root root -
d /var/lib/libvirt/filesystems 0711 root root -
d /var/lib/libvirt/images 0711 root root -
d /var/lib/libvirt/network 0700 root root -
d /var/lib/libvirt/qemu 0711 qemu qemu -
d /var/lib/libvirt/qemu/checkpoint 0711 qemu qemu -
d /var/lib/libvirt/qemu/dump 0711 qemu qemu -
d /var/lib/libvirt/qemu/nvram 0711 qemu qemu -
d /var/lib/libvirt/qemu/ram 0711 qemu qemu -
d /var/lib/libvirt/qemu/save 0711 qemu qemu -
d /var/lib/libvirt/qemu/snapshot 0711 qemu qemu -
d /var/lib/libvirt/swtpm 0711 root root -
d /var/log/libvirt 0700 root root -
d /var/log/libvirt/qemu 0700 root root -
Z /var/cache/libvirt
Z /var/lib/libvirt
Z /var/log/libvirt
