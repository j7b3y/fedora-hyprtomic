name: bluebuild-gui
on:
  # Only the integration branch publishes. Feature branches are validated by
  # opening a PR, or on demand via workflow_dispatch (avoids rebuilding the
  # expensive GUI image on every development push).
  push:
    branches:
      - main
    paths:
      - "recipes/gui.yml"
      - "files/gui/**"
      - "files/gui-build/**"
      - ".github/workflows/gui.yml"
  pull_request:
    paths:
      - "recipes/gui.yml"
      - "files/gui/**"
      - "files/gui-build/**"
      - ".github/workflows/gui.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild-gui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Build GUI container
        uses: blue-build/github-action@v1.11
        with:
          recipe: gui.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          use_cache: true
