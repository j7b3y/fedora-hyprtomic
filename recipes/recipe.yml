---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-hyprtomic
description: Personal Fedora Atomic Hyprland image (wayblue base) with custom Hyprland UI

base-image: ghcr.io/wayblueorg/hyprland
image-version: latest # wayblue's only supported tag; tracks current Fedora stable

modules:
  # 1. Bake generic dotfiles, SDDM conf, bitwarden polkit rule, setup script, ujust recipe
  - type: files
    files:
      - source: system
        destination: /

  # 2. System-layer packages (Fedora official repos only; no copr)
  - type: dnf
    install:
      packages:
        # Session: hyprland/hyprlock/hypridle/portals/sddm come from wayblue base
        - quickshell
        # SDDM astronaut theme deps
        - qt6-qtsvg
        - qt6-qtvirtualkeyboard
        - qt6-qtmultimedia
        - qt6-qt5compat
        # Audio
        - pipewire
        - pipewire-pulseaudio
        - wireplumber
        - pavucontrol
        # Network
        - NetworkManager
        - network-manager-applet
        # Bluetooth (blueman removed; managed via quickshell BluetoothSection)
        - bluez
        # Auth base (polkit + hyprpolkitagent provided by wayblue base)
        - gnome-keyring
        # Qt / theme
        - qt5ct
        - qt6ct
        - kvantum
        - qt5-qtwayland
        - papirus-icon-theme
        # Fonts
        - google-noto-sans-fonts
        - google-noto-sans-cjk-fonts
        - fontawesome-fonts
        # Bar / notify / launcher
        - waybar
        - dunst
        - swaybg
        # Screenshot / clipboard
        - grim
        - slurp
        - wl-clipboard
        - cliphist
        # Utilities
        - brightnessctl
        - playerctl
        - libnotify
        - dex-autostart
        - python3-gobject
        # File manager (Fedora official; promoted from user-later to system standard)
        - nemo
        - nemo-extensions
        - file-roller
        - ffmpegthumbnailer
        - tumbler
        # IME (native fcitx5 + mozc = auto Japanese input; hazkey engine stays manual)
        - fcitx5
        - fcitx5-mozc
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-configtool
        # Deps for source-built user tools (clipryx / hypr-emoji-picker / snipland)
        - wtype
        - python3-cairo
        - google-noto-color-emoji-fonts
        # Common dev tools (used across all dev envs)
        - git
        - git-credential-oauth
        - python3-pip
        - android-tools
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
  # 3. Build-time scripts (live in files/scripts/; reference by bare filename)
  - type: script
    scripts:
      - install-hyprbind.sh
      - install-ghostty.sh
      - install-nwg-dock.sh
      - install-sddm-theme.sh
      - install-catppuccin-theme.sh
      - install-clipryx.sh
      - install-hypr-emoji-picker.sh
      - install-snipland.sh
      - install-hazkey.sh
      - finalize.sh

  # 4. Default Flatpaks (system scope = auto-provisioned "standard" apps)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.bitwarden.desktop

  - type: signing # proper policy & signing for signed images
