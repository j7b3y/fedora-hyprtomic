---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-hyprtomic
description: Personal Fedora Atomic (uBlue base-main) image with Hyprland + custom Hyprland UI

base-image: ghcr.io/ublue-os/base-main
image-version: latest # tracks latest stable (currently ~F44)

modules:
  # 1. Bake generic dotfiles, SDDM conf, bitwarden polkit rule, setup script, ujust recipe
  - type: files
    files:
      - source: system
        destination: /

  # 2. System-layer packages (Fedora names)
  - type: dnf
    repos:
      copr:
        - solopasha/hyprland # rofi-wayland, nwg-dock-hyprland, nwg-displays, hyprpicker
    install:
      packages:
        # Compositor / session
        - hyprland
        - hyprlock
        - hypridle
        - xdg-desktop-portal-hyprland
        - quickshell
        # Display manager + SDDM theme deps
        - sddm
        - qt6-svg
        - qt6-virtualkeyboard
        - qt6-multimedia
        - qt6-5compat
        # Audio
        - pipewire
        - pipewire-pulseaudio
        - wireplumber
        - pavucontrol
        # Network
        - NetworkManager
        - network-manager-applet
        # Bluetooth (blueman removed; managed via quickshell BluetoothSection)
        - bluez
        # Auth base
        - polkit
        - polkit-gnome
        - gnome-keyring
        # Qt / theme
        - qt5ct
        - qt6ct
        - kvantum
        - qt5-qtwayland
        - papirus-icon-theme
        # Fonts
        - google-noto-sans-fonts
        - google-noto-sans-cjk-fonts
        - fontawesome-fonts
        # Bar / notify / launcher
        - waybar
        - dunst
        - rofi-wayland
        - swaybg
        - nwg-dock-hyprland
        - nwg-displays
        # Screenshot / clipboard
        - grim
        - slurp
        - wl-clipboard
        - cliphist
        - hyprpicker
        # Utilities
        - brightnessctl
        - playerctl
        - libnotify
        - dex
        - python3-gobject
        # Common dev tools (used across all dev envs)
        - git
        - git-credential-oauth
        - python3-pip
        - android-tools
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
  # 3. Build-time scripts: rpmfusion, HyprBind (source build), SDDM theme, uwsm, catppuccin theme, finalize
  - type: script
    scripts:
      - scripts/enable-rpmfusion.sh
      - scripts/install-hyprbind.sh
      - scripts/install-sddm-theme.sh
      - scripts/install-uwsm.sh
      - scripts/install-catppuccin-theme.sh
      - scripts/finalize.sh

  # 4. Default Flatpaks (GUI apps default to Flatpak where possible)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: user
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.bitwarden.desktop

  - type: signing # proper policy & signing for signed images
