name: bluebuild-vypr
on:
  # Same weekly pace as the base image so latest-vypr tracks base updates.
  schedule:
    - cron:
        "0 6 * * 1" # weekly (Mon 06:00 UTC)
  push:
    branches:
      - main # only main publishes; feature branches are validated via PR
    paths:
      - "recipes/recipe-vypr.yml"
      - "recipes/recipe-common-packages.yml"
      - "recipes/recipe-common-dotfiles.yml"
      - "files/system/**"
      - "files/vypr/**"
      - "files/scripts/**"
      - "!files/scripts/gui-*" # GUI-only scripts build in gui.yml
      - "!**/*.md"
      - ".github/workflows/vypr.yml"
  # Pull requests always trigger this workflow (no paths filter) so the
  # `bluebuild-vypr` check is reported on every PR (mirror of build.yml); the
  # expensive build is skipped for PRs that touch none of the paths above and
  # the job stays green.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild-vypr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: read # dorny/paths-filter fetches the PR file list via the API
    steps:
      # PR change detection: mirror of the push paths filter above.
      - name: Detect Vypr-image changes (PR only)
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - "recipes/recipe-vypr.yml"
              - "recipes/recipe-common-packages.yml"
              - "recipes/recipe-common-dotfiles.yml"
              - "files/system/**"
              - "files/vypr/**"
              - "files/scripts/**"
              - "!files/scripts/gui-*"
              - "!**/*.md"
              - ".github/workflows/vypr.yml"
      # Builds + publishes ghcr.io/<repo>:latest-vypr (alt-tags in the recipe;
      # the default latest/timestamp tags are replaced, so this can never
      # overwrite the base image's :latest). On PR it builds a PR-scoped image.
      - name: Build Vypr image
        if: github.event_name != 'pull_request' || steps.changes.outputs.build == 'true'
        uses: blue-build/github-action@v1.13
        with:
          recipe: recipe-vypr.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          use_cache: true

      # Date tag for easy rollback, mirroring the base image's.
      - name: Tag image with date
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          DATE=$(date +%Y.%m.%d)
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "Tagging $IMAGE:latest-vypr as $IMAGE:vypr-$DATE"
          skopeo copy \
            --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://$IMAGE:latest-vypr" \
            "docker://$IMAGE:vypr-$DATE"
