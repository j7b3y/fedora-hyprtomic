---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-hyprtomic
description: Personal Fedora Atomic Hyprland image (wayblue base) with custom Hyprland UI

base-image: ghcr.io/wayblueorg/hyprland
image-version: latest # wayblue's only supported tag; tracks current Fedora stable

modules:
  # NOTE: module order matters for layer caching. Slow-but-stable layers (dnf) go
  # first; frequently-edited layers (files/scripts) go last so dotfile tweaks
  # don't invalidate the package layer.

  # 1. Rebrand os-release (wayblue sets NAME="wayblue", which leaks into GRUB entries)
  - type: os-release
    properties:
      NAME: "HyprTomic"
      PRETTY_NAME: "Hyprtomic (powered by Fedora Atomic)"
      VARIANT: "Hyprtomic"
      VARIANT_ID: "hyprtomic"
      HOME_URL: "https://github.com/j7b3y/fedora-hyprtomic"
      DOCUMENTATION_URL: "https://github.com/j7b3y/fedora-hyprtomic"
      SUPPORT_URL: "https://github.com/j7b3y/fedora-hyprtomic/issues"
      BUG_REPORT_URL: "https://github.com/j7b3y/fedora-hyprtomic/issues"
      DEFAULT_HOSTNAME: "hyprtomic"

  # 2. System-layer packages (Fedora official repos only; no copr)
  - type: dnf
    install:
      packages:
        # Session: hyprland/hyprlock/hypridle/portals/sddm come from wayblue base
        - quickshell
        # SDDM astronaut theme deps
        - qt6-qtsvg
        - qt6-qtvirtualkeyboard
        - qt6-qtmultimedia
        - qt6-qt5compat
        # Audio
        - pipewire
        - pipewire-pulseaudio
        - wireplumber
        - pavucontrol
        # Network
        - NetworkManager
        - network-manager-applet
        # Bluetooth (blueman removed; managed via quickshell BluetoothSection)
        - bluez
        # Auth base (polkit + hyprpolkitagent provided by wayblue base)
        - gnome-keyring
        # Qt / theme
        - qt5ct
        - qt6ct
        - kvantum
        - qt5-qtwayland
        - papirus-icon-theme
        # Fonts
        - google-noto-sans-fonts
        - google-noto-sans-cjk-fonts
        - fontawesome-fonts
        # Bar / notify / launcher
        - waybar
        - dunst
        - swaybg
        # Screenshot / clipboard
        - grim
        - slurp
        - wl-clipboard
        - cliphist
        # Utilities
        - brightnessctl
        - playerctl
        - libnotify
        - dex-autostart
        - python3-gobject
        - fastfetch
        # File manager (Fedora official; promoted from user-later to system standard)
        - nemo
        - nemo-extensions
        - file-roller
        - ffmpegthumbnailer
        - tumbler
        # IME (native fcitx5; hazkey engine installed via copr; profile enables it)
        - fcitx5
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-configtool
        # Deps for source-built user tools (clipryx / hypr-emoji-picker / snipland)
        - wtype
        - python3-cairo
        - google-noto-color-emoji-fonts
        # Common dev tools (used across all dev envs)
        - git
        - git-credential-oauth
        - python3-pip
        - android-tools
        - zsh

  # 2b. UI deps referenced by the baked configs (dotfiles arch/lua shelf/waybar
  # /launcher). skip-unavailable: not all packages exist on every Fedora branch.
  # uwsm (required by the quickshell launcher) is not in Fedora repos at all;
  # it is source-built by install-uwsm.sh.
  - type: dnf
    install:
      skip-unavailable: true
      packages:
        # shelf SearchButton (drun) + SUPER+Escape window switcher
        - rofi-wayland
        # SUPER+SHIFT+P color picker
        - hyprpicker
        # Nerd Font PUA glyphs (U+F0000+) used by quickshell StatusArea and
        # the waybar custom-* scripts; missing from FontAwesome/standard Noto
        - cascadia-mono-nf-fonts

  # 3. Bake dotfiles, SDDM conf/units, polkit rule, firstboot scripts, ujust recipe
  - type: files
    files:
      - source: system
        destination: /

  # 4. Build-time scripts (live in files/scripts/; reference by bare filename)
  - type: script
    scripts:
      - install-hyprbind.sh
      - install-ghostty.sh
      - install-nwg-dock.sh
      - install-sddm-theme.sh
      - install-catppuccin-theme.sh
      - install-clipryx.sh
      - install-hypr-emoji-picker.sh
      - install-snipland.sh
      - install-uwsm.sh
      - install-hazkey.sh
      - finalize.sh
      # Needs finalize.sh first (chmods setup-dotfiles.sh)
      - install-skel.sh

  # 5. Enable firstboot services (unique hostname per machine; zsh default shell)
  - type: systemd
    system:
      enabled:
        - hyprtomic-hostname.service
        - hyprtomic-zsh-default.service

  # 6. Default Flatpaks (system scope = auto-provisioned "standard" apps)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.bitwarden.desktop

  - type: signing # proper policy & signing for signed images
