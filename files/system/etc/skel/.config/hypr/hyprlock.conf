general {
    hide_cursor = true
    fail_timeout = 1000
}

auth {
    pam {
        enabled = true
    }

    # HyprTomic: native fingerprint is OFF on purpose. It holds the fprintd
    # device for the whole lock session and overheats this sensor class
    # (~3 min: "Device disabled to prevent overheating"). Fingerprint runs
    # bounded (10s per attempt) through PAM instead: submit empty to open a
    # fingerprint window, or type the password to skip it (see
    # /etc/pam.d/hyprlock). Never enable this together with pam_fprintd.
    fingerprint {
        enabled = false
        ready_message = (指紋認証でロック解除)
        present_message = 指紋を読み取り中
    }
}

background {
    path = screenshot
    blur_passes = 2
    brightness = 0.56
}

label {
    text = $TIME
    color = rgb(e6edf3)
    font_size = 90
    font_family = Noto Sans
    position = 0, 200
    halign = center
    valign = center
}

label {
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = rgb(e6edf3)
    font_size = 25
    font_family = Noto Sans
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(cba6f7)
    inner_color = rgb(161b22)
    font_color = rgb(e6edf3)
    fade_on_empty = false
    placeholder_text = <span foreground="##e6edf3"><i>空Enter: 指紋 / 入力: パスワード</i></span>
    hide_input = false
    check_color = rgb(cba6f7)
    fail_color = rgb(f85149)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(e3b341)
    position = 0, -30
    halign = center
    valign = center
}

# PAM prompt (pam_fprintd messages; empty while no PAM prompt is active).
label {
    text = $PAMPROMPT
    color = rgb(e6edf3)
    font_size = 16
    font_family = Noto Sans
    position = 0, 40
    halign = center
    valign = center
}
