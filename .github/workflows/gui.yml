name: bluebuild-gui
on:
  # Only the integration branch publishes. Feature branches are validated by
  # opening a PR, or on demand via workflow_dispatch (avoids rebuilding the
  # expensive GUI image on every development push).
  push:
    branches:
      - main
    paths:
      - "recipes/gui.yml"
      - "files/gui/**"
      - "files/gui-build/**"
      - ".github/workflows/gui.yml"
  # Pull requests always trigger this workflow (no paths filter) so the
  # `bluebuild-gui` check is reported even when only host-side files changed
  # (mirror of build.yml). The expensive GUI build stays skipped for such PRs:
  # the build step below is conditional, the job itself stays green.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild-gui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: read # dorny/paths-filter fetches the PR file list via the API
    steps:
      # PR change detection: mirror of the push paths filter above. On
      # push/schedule/dispatch the workflow is already path-filtered, so the
      # build always runs and this step is skipped.
      - name: Detect GUI-image changes (PR only)
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - "recipes/gui.yml"
              - "files/gui/**"
              - "files/gui-build/**"
              - ".github/workflows/gui.yml"
      - name: Build GUI container
        if: github.event_name != 'pull_request' || steps.changes.outputs.build == 'true'
        uses: blue-build/github-action@v1.13
        with:
          recipe: gui.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          use_cache: true
