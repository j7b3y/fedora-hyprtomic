[preferred]
# Flatpak "run in background" / autostart permissions.
#
# Neither the Hyprland backend (xdg-desktop-portal-hyprland) nor the GTK
# backend (xdg-desktop-portal-gtk) implements
# org.freedesktop.impl.portal.Background. Without a backend for it,
# xdg-desktop-portal does not export org.freedesktop.portal.Background at
# all: apps cannot request the permission (their "start on login" toggles
# fail silently) and Flatseal greys its Background toggle out.
#
# xdg-desktop-portal-gnome (installed by the recipe) implements the
# interface. Route only Background to it; every other interface keeps the
# normal defaults (hyprland, then gtk) from the configs that follow this one.
org.freedesktop.impl.portal.Background = gnome
