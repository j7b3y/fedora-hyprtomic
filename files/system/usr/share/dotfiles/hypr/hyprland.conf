# Hyprland Configuration

# Monitor - auto detect
monitor = ,preferred,auto,1.0

# Variables
$terminal = ghostty
$fileManager = nemo
$menu = qs ipc call launcher toggle
$mainMod = SUPER

# Optional per-device overrides live in ~/.config/hypr/host.conf (auto-created).
# To pin the dock (and optionally waybar) to a specific output, add there:
#   env = MONITOR_PRIMARY, eDP-1
# Leave unset to show on all displays by default.
source = ~/.config/hypr/host.conf

# Environment
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,catppuccin-mocha-blue-standard+default
env = ADW_DEBUG_COLOR_SCHEME,prefer-dark
env = XCURSOR_THEME,Mafuyu
env = XCURSOR_SIZE,36
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Autostart
exec-once = dbus-update-activation-environment --systemd --all
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
exec-once = rm -rf $HOME/.cache/cliphist/db
exec-once = wl-paste --watch cliphist store
exec-once = waybar
exec-once = dunst
exec-once = env GDK_BACKEND=x11 nm-applet
exec-once = ~/.config/hypr/scripts/dock-watch.sh
exec-once = qs
exec-once = swaybg -i $HOME/.local/share/backgrounds/wallpaper.jpg -m fill
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = sleep 2 && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# General
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(8AB4F8cc)
    col.inactive_border = rgba(33353Aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# Group (tabs) - integrated with terminal window
group {
    col.border_active = rgba(ffffffcc)
    col.border_inactive = rgba(808080aa)
    # auto_group=false: chrome 等の自動グループ参加を防止
    auto_group = false
    groupbar {
        enabled = true
        font_size = 10
        height = 24
        gradients = true
        blur = true
        col.active = rgba(000000e6)
        col.inactive = rgba(000000e6)
        text_color = rgba(ffffffff)
        text_color_inactive = rgba(ffffffff)
        indicator_height = 2
        rounding = 4
        gradient_rounding = 4
    }
}

# Decoration
decoration {
    rounding = 10
    rounding_power = 2
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        popups = false
        size = 4
        passes = 1
    }
}

# Animations
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Layout
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    middle_click_paste = false
    disable_autoreload = true
    render_unfocused_fps = 10
}

cursor {
    no_hardware_cursors = false
}

render {
    new_render_scheduling = true
}

# Input
input {
    kb_layout = jp
    kb_options = caps:none
    repeat_delay = 800
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0.2
    touchpad {
        natural_scroll = false
        scroll_factor = 1.5
    }
}

# Keybindings (with descriptions)
bindd = $mainMod, S, キーバインドを確認, exec, hyprbind
bindd = $mainMod, Q, ターミナルを開く (単体), exec, $terminal
bindd = $mainMod, X, アクティブウィンドウを閉じる, killactive
bindd = $mainMod, E, ファイルマネージャを開く, exec, $fileManager
bindd = $mainMod, F, フローティング切り替え, togglefloating
bindd = , Henkan_Mode, アプリランチャを開く (変換キー), exec, $menu
bindd = $mainMod, P, Pseudo モード切り替え (dwindle), pseudo
bindd = $mainMod, J, スプリット方向切り替え (dwindle), layoutmsg, togglesplit
bindd = $mainMod, L, 画面ロック, exec, hyprlock
bindd = $mainMod, C, Chrome を開く, exec, google-chrome-stable --ozone-platform=wayland
bindd = $mainMod, M, pfmon パフォーマンスモニタ, exec, ghostty --class=local.pfmon -e pfmon
bindd = $mainMod, B, Bitwarden を開く, exec, bitwarden
# Focus
bindd = $mainMod, left, フォーカス移動: 左, movefocus, l
bindd = $mainMod, right, フォーカス移動: 右, movefocus, r
bindd = $mainMod, up, フォーカス移動: 上, movefocus, u
bindd = $mainMod, down, フォーカス移動: 下, movefocus, d
# Move window
bindd = $mainMod SHIFT, left, ウィンドウ移動: 左, movewindow, l
bindd = $mainMod SHIFT, right, ウィンドウ移動: 右, movewindow, r
bindd = $mainMod SHIFT, up, ウィンドウ移動: 上, movewindow, u
bindd = $mainMod SHIFT, down, ウィンドウ移動: 下, movewindow, d
# Utilities
bindd = $mainMod SHIFT, S, 領域スクリーンショット (snipland), exec, snipland
bindd = $mainMod CTRL SHIFT, S, 領域スクリーンショット (snipland), exec, snipland
bindd = $mainMod SHIFT, P, カラーピッカー, exec, hyprpicker -a -f hex
bindd = $mainMod, DELETE, 電源メニュー, exec, qs ipc call powermenu toggle
bindd = $mainMod, A, コントロールセンター, exec, qs ipc call controlcenter toggle

# Ghostty ネイティブタブを使用 (Ctrl+Shift+T/Q/←/→ は Ghostty が処理)
# Alacritty 用 tab-control.sh は廃止 (Hyprland group の制限が大きいため)
# Workspaces
bindd = $mainMod, 1, ワークスペース 1 へ, workspace, 1
bindd = $mainMod, 2, ワークスペース 2 へ, workspace, 2
bindd = $mainMod, 3, ワークスペース 3 へ, workspace, 3
bindd = $mainMod, 4, ワークスペース 4 へ, workspace, 4
bindd = $mainMod, 5, ワークスペース 5 へ, workspace, 5
bindd = $mainMod, 6, ワークスペース 6 へ, workspace, 6
bindd = $mainMod, 7, ワークスペース 7 へ, workspace, 7
bindd = $mainMod, 8, ワークスペース 8 へ, workspace, 8
bindd = $mainMod, 9, ワークスペース 9 へ, workspace, 9
bindd = $mainMod, 0, ワークスペース 10 へ, workspace, 10
# Move to workspace
bindd = $mainMod SHIFT, 1, ウィンドウをワークスペース 1 に移動, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, ウィンドウをワークスペース 2 に移動, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, ウィンドウをワークスペース 3 に移動, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, ウィンドウをワークスペース 4 に移動, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, ウィンドウをワークスペース 5 に移動, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, ウィンドウをワークスペース 6 に移動, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, ウィンドウをワークスペース 7 に移動, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, ウィンドウをワークスペース 8 に移動, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, ウィンドウをワークスペース 9 に移動, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, ウィンドウをワークスペース 10 に移動, movetoworkspace, 10
# Workspace scroll
bindd = $mainMod, mouse_down, 次のワークスペース (スクロール), workspace, e+1
bindd = $mainMod, mouse_up, 前のワークスペース (スクロール), workspace, e-1
bindd = $mainMod, bracketleft, 前のワークスペース, workspace, e-1
bindd = $mainMod, bracketright, 次のワークスペース, workspace, e+1
bindd = $mainMod, TAB, 次のワークスペース (Tab), workspace, e+1
# Disable noisy keys
bindd = , Caps_Lock, Caps Lock 無効化, exec, true
bindd = , Insert, Insert キー無効化, exec, true

# Repeat bindings (with descriptions)
bindde = $mainMod CTRL, left, ウィンドウリサイズ: 左 -20px, resizeactive, -20 0
bindde = $mainMod CTRL, right, ウィンドウリサイズ: 右 +20px, resizeactive, 20 0
bindde = $mainMod CTRL, up, ウィンドウリサイズ: 上 -20px, resizeactive, 0 -20
bindde = $mainMod CTRL, down, ウィンドウリサイズ: 下 +20px, resizeactive, 0 20

# Mouse bindings (with descriptions)
bindmd = $mainMod, mouse:272, マウスドラッグでウィンドウ移動, movewindow
bindmd = $mainMod, mouse:273, マウスドラッグでウィンドウリサイズ, resizewindow

# Locked bindings - work on lock screen (with descriptions)
bindeld = ,XF86AudioRaiseVolume, 音量を上げる, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = ,XF86AudioLowerVolume, 音量を下げる, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindeld = ,XF86AudioMute, 出力ミュート切り替え, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = ,XF86AudioMicMute, マイクミュート切り替え, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = ,XF86MonBrightnessUp, 画面輝度を上げる, exec, ~/.config/hypr/scripts/bright.sh 5%+
bindeld = ,XF86MonBrightnessDown, 画面輝度を下げる, exec, ~/.config/hypr/scripts/bright.sh 5%-

bindld = , XF86AudioNext, 次の曲, exec, playerctl next
bindld = , XF86AudioPause, 再生/一時停止, exec, playerctl play-pause
bindld = , XF86AudioPlay, 再生/一時停止, exec, playerctl play-pause
bindld = , XF86AudioPrev, 前の曲, exec, playerctl previous

# Regular bindings (no descriptions)
bind = SUPER, V, exec, clipryx
bind = SUPER, period, exec, hypr-emoji-picker

# Window rules
windowrule = match:class ^(google-chrome|nemo|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager|Blueman-manager|nwg-look|org.gnome.FileRoller|org.fcitx.fcitx5-config-qt)$, opacity 0.925
windowrule = match:class ^com\.mitchellh\.ghostty$, opacity 1.0
windowrule = match:class ^(authentication-agent|Rustdesk|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager|Blueman-manager)$, float on
windowrule = match:initial_class ^(qt5ct|org.shotcut.Shotcut)$, float on
windowrule = match:initial_class ^(QQ|qqmusic|wechat)$, pseudo on
windowrule = match:initial_class ^(steam)$, float on
windowrule = match:initial_class .*-desktop-portal-.*, float on
windowrule = match:initial_class .*-desktop-portal-.*, center on

# Layer rules
layerrule = blur on, match:namespace waybar
layerrule = blur_popups on, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = blur off, match:namespace quickshell:powermenu
layerrule = ignore_alpha 0.5, match:namespace quickshell:powermenu
layerrule = blur on, match:namespace quickshell:controlcenter
layerrule = ignore_alpha 0.5, match:namespace quickshell:controlcenter
layerrule = blur off, match:namespace quickshell:notifications
layerrule = ignore_alpha 0.5, match:namespace quickshell:notifications
layerrule = blur on, match:namespace quickshell:shelf
layerrule = ignore_alpha 0.5, match:namespace quickshell:shelf
layerrule = blur off, match:namespace quickshell:launcher
layerrule = ignore_alpha 0.5, match:namespace quickshell:launcher
layerrule = blur off, match:namespace quickshell:volume-osd
layerrule = ignore_alpha 0.5, match:namespace quickshell:volume-osd
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.2, match:namespace rofi

# Extra window rules (new format)
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = float-satty
    match:class = com.gabm.satty
    float = on
    size = (monitor_w*0.6) (monitor_h*0.7)
    center = on
}

windowrule {
    name = float-missioncenter
    match:class = io.missioncenter.MissionCenter
    float = on
    size = (monitor_w*0.5) (monitor_h*0.6)
    center = on
    opacity = 0.85
}

windowrule {
    name = float-pfmon
    match:class = ^local\.pfmon$
    monitor = $MONITOR_PRIMARY
    float = on
    size  = 1360 765
    center = on
    no_anim = on
    border_size = 1
    rounding = 6
}

windowrule {
    name = float-hyprbind
    match:initial_title = ^HyprBind$
    float = on
    size = (monitor_w*0.5) (monitor_h*0.6)
    center = on
    opacity = 0.85
}

windowrule {
    name = pip-float
    match:title = ^(Picture-in-Picture|ピクチャー イン ピクチャー)$
    float = on
    pin = on
    suppress_event = float
}

windowrule {
    name = float-waydroid
    match:class = Waydroid
    float = on
    center = on
    suppress_event = activate activatefocus
}

windowrule {
    name = float-wine-proton
    match:class = ^(steam_app_.*|.*\.exe)$
    float = on
}
