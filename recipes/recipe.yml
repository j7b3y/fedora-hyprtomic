---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-hyprtomic
description: Personal Fedora Atomic Hyprland image (wayblue base) with custom Hyprland UI

base-image: ghcr.io/wayblueorg/hyprland
image-version: latest # wayblue's only supported tag; tracks current Fedora stable

modules:
  # NOTE: module order matters for layer caching. Slow-but-stable layers (dnf) go
  # first; frequently-edited layers (files/scripts) go last so dotfile tweaks
  # don't invalidate the package layer.

  # 1. Rebrand os-release (wayblue sets NAME="wayblue", which leaks into GRUB entries)
  - type: os-release
    properties:
      NAME: "HyprTomic"
      PRETTY_NAME: "HyprTomic (powered by Fedora Atomic)"
      VARIANT: "HyprTomic"
      VARIANT_ID: "hyprtomic"
      HOME_URL: "https://github.com/j7b3y/fedora-hyprtomic"
      DOCUMENTATION_URL: "https://github.com/j7b3y/fedora-hyprtomic"
      SUPPORT_URL: "https://github.com/j7b3y/fedora-hyprtomic/issues"
      BUG_REPORT_URL: "https://github.com/j7b3y/fedora-hyprtomic/issues"
      DEFAULT_HOSTNAME: "hyprtomic"

  # 2. System-layer packages (Fedora official + the end-4 COPR only for the
  #    Bibata cursor theme, which the compositor loads and Fedora does not ship;
  #    the GUI shell itself lives in the Arch container)
  - type: dnf
    repos:
      cleanup: true
      files:
        - ririko66z-dots-hyprland.repo # bibata-cursor-theme
    install:
      skip-unavailable: true
      packages:
        # Session: hyprland/hyprlock/hypridle/portals/sddm come from wayblue base.
        # The GUI shell (quickshell + ii helpers) is NOT installed here: it lives
        # in the Arch GUI container (ghcr.io/j7b3y/hyprtomic-gui).
        # SDDM astronaut theme deps
        - qt6-qtsvg
        - qt6-qtvirtualkeyboard
        - qt6-qtmultimedia
        - qt6-qt5compat
        # Audio
        - pipewire
        - pipewire-pulseaudio
        - wireplumber
        - pavucontrol
        # Network
        - NetworkManager
        # Bluetooth (managed via the quickshell BluetoothSection)
        - bluez
        # Auth base (polkit + hyprpolkitagent provided by wayblue base)
        - gnome-keyring
        # Qt wayland backend
        - qt5-qtwayland
        # Fonts (base set; end-4 decoration fonts + IME live in the GUI container)
        - google-noto-sans-cjk-fonts
        - google-noto-color-emoji-fonts
        - twitter-twemoji-fonts
        # Cursor theme (loaded by the compositor, so it must be on the host)
        - bibata-cursor-theme
        # Bar / notifications: provided by quickshell in the GUI container
        # (waybar/dunst/swaybg removed -- end-4 uses its own shell).
        # Screenshot / clipboard
        - grim
        - slurp
        - wl-clipboard
        - cliphist
        # Utilities
        - brightnessctl
        - playerctl
        - libnotify
        - dex-autostart
        - distrobox # GUI container runtime (hyprtomic-gui-shell / ujust gui-container-*)
        - python3-gobject
        - fastfetch
        # File manager (Fedora official; promoted from user-later to system standard)
        - nemo
        - nemo-extensions
        - file-roller
        - ffmpegthumbnailer
        - tumbler
        # IME: managed inside the GUI container (fcitx5 + engine there), so the
        # input method is available to the container's GUI apps.
        # Deps for source-built user tools (clipryx / hypr-emoji-picker / snipland)
        - wtype
        - ydotool # provides /usr/lib/systemd/system/ydotool.service (linked as a user unit)
        - python3-cairo
        - google-noto-color-emoji-fonts
        # Common dev tools (used across all dev envs)
        - git
        - git-credential-oauth
        - python3-pip
        - android-tools
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting

  # 3. Bake dotfiles, SDDM conf/units, polkit rule, firstboot scripts, ujust recipe
  - type: files
    files:
      - source: system
        destination: /

  # 4. Build-time scripts (live in files/scripts/; reference by bare filename)
  - type: script
    scripts:
      - install-ghostty.sh
      - install-sddm-theme.sh
      - install-hazkey.sh
      - finalize.sh

  # 5. Enable firstboot/session services (hostname, user groups, zsh default;
  #    ydotool daemon as a user unit, mirroring upstream)
  - type: systemd
    system:
      enabled:
        - hyprtomic-hostname.service
        - hyprtomic-groups.service
        - hyprtomic-zsh-default.service
    user:
      enabled:
        - ydotool.service

  # 6. Default Flatpaks (system scope = auto-provisioned "standard" apps)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.bitwarden.desktop

  - type: signing # proper policy & signing for signed images
