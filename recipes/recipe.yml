---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-hyprtomic
description: Personal Fedora Atomic Hyprland image (wayblue base) with custom Hyprland UI

base-image: ghcr.io/wayblueorg/hyprland
image-version: latest # wayblue's only supported tag; tracks current Fedora stable

# Shared module lists, also used by recipe-vypr.yml:
#   recipe-common-packages.yml - os-release + system packages (slow, stable)
#   recipe-common-dotfiles.yml - skel dotfiles, build scripts, services, flatpaks
# Keep the order (packages, then dotfiles) so dotfile edits do not invalidate
# the package layer.
modules:
  - from-file: recipe-common-packages.yml
  - from-file: recipe-common-dotfiles.yml
  - type: signing # proper policy & signing for signed images
